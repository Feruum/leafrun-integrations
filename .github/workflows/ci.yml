name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Source adapters (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Check mandatory native tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command git -ErrorAction Stop | Out-Null
          Get-Command ssh -ErrorAction Stop | Out-Null
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ssh -V
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test adapters
        shell: pwsh
        env:
          GOWORK: 'off'
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP 'leafrun-adapters-test.log'
          go test ./... -count=1 -v 2>&1 | Tee-Object -FilePath $testLog
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            @('### Source adapter test failure', '', '```text') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content -LiteralPath $testLog | Select-Object -Last 200 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          exit $testExit
      - name: Vet
        env:
          GOWORK: 'off'
        run: go vet ./...
      - name: Build
        env:
          GOWORK: 'off'
        run: go build ./...
      - name: Race detector
        if: runner.os == 'Linux'
        env:
          GOWORK: 'off'
        run: go test -race ./... -count=1
